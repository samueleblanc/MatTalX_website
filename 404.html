<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex">
        <title>MatTalX - Page not found</title>
        <!--
            GitHub Pages serves this file for any address it does not have, at whatever
            depth that address happens to be: /nope, /docs/nope, /a/b/c/nope. A relative
            link would resolve against the missing path and break, so this page is the
            one place on the site that uses root-relative paths, and carries its own
            styles rather than fetching a stylesheet.
        -->
        <link rel="icon" type="image/png" sizes="32x32" href="/images/mattalx_favicon32.png">
        <link rel="icon" type="image/png" sizes="96x96" href="/images/mattalx_favicon96.png">
        <style>
            :root {
                --ground: #ffffff;
                --ink: #16211d;
                --ink-soft: #5c6b65;
                --rule: #dfe5e2;
                --accent: #0f8867;
                --link: #0a654d;
                --button-ground: rgb(230, 229, 229);
                --button-hover: lightgrey;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --ground: #14181a;
                    --ink: #e4ece8;
                    --ink-soft: #9aa8a2;
                    --rule: #2a3336;
                    --accent: #22b98d;
                    --link: #22b98d;
                    --button-ground: rgb(53, 53, 53);
                    --button-hover: rgb(66, 66, 66);
                }
            }
            body {
                margin: 0;
                background-color: var(--ground);
                color: var(--ink);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            html { scrollbar-color: var(--accent) transparent; }
            header {
                background-color: #000000;
                text-align: left;
            }
            header img {
                width: 11%;
                min-width: 160px;
                padding-left: 10px;
                display: block;
            }
            main {
                margin: 4% auto;
                padding: 0 7%;
                max-width: 640px;
                text-align: center;
            }
            h1 {
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-weight: lighter;
                font-size: 30px;
            }
            p { font-size: 18px; }
            .sum {
                /* Something true and on topic, rather than a cartoon */
                font-size: 26px;
                margin: 28px 0;
                color: var(--accent);
            }
            ul { list-style: none; padding: 0; }
            li { display: inline-block; margin: 6px; }
            a.button {
                display: inline-block;
                padding: 12px 18px;
                border-radius: 6px;
                background-color: var(--button-ground);
                color: var(--ink);
                font-size: 16px;
                text-decoration: none;
            }
            a.button:hover { background-color: var(--button-hover); }
            main a:not(.button) { color: var(--link); }
            ::selection { background-color: var(--accent); color: var(--ground); }
        </style>
    </head>
    <body>
        <header>
            <a href="/"><img alt="MatTalX" src="/images/mattalx_logo_nobg_dark.png"></a>
        </header>
        <main>
            <h1>There is nothing at this address</h1>
            <p class="sum">∅</p>
            <p>The page may have moved. Everything on the site is one of these:</p>
            <ul>
                <li><a class="button" href="/">Home</a></li>
                <li><a class="button" href="/web-version/">Try it in the browser</a></li>
                <li><a class="button" href="/docs/">Documentation</a></li>
            </ul>
            <p>If you followed a link from somewhere and it brought you here,
                <a href="https://github.com/samueleblanc/MatTalX/issues" target="_blank">tell us</a>
                and we will fix it.</p>
        </main>
    </body>
</html>
